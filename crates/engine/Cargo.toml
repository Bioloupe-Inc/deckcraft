[package]
name = "deckcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-pdf = { workspace = true }
deckcraft-format = { workspace = true }
deckcraft-pptx = { workspace = true }
deckcraft-media = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[features]
default = ["media", "last-resort-font"]
# Reading embedded audio and video: probing on insert and in `media.info`, poster frames
# (deckcraft-media and its codecs). Without it media still embeds and round-trips, unplayed.
media = ["dep:deckcraft-media"]
# deckcraft-fonts' compiled-in last-resort face.
last-resort-font = ["deckcraft-fonts/last-resort-font"]

[dev-dependencies]
epaint_default_fonts = "0.36"
